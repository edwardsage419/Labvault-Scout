name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not upload confidential or sensitive research data."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LabVault Scout version
  - type: input
    id: environment
    attributes:
      label: Python and operating system
