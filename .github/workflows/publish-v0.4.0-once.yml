name: Publish LabVault Scout v0.4.0 once
on:
  push:
    branches:
      - publication/v0.4.0

permissions:
  contents: write

concurrency:
  group: labvault-scout-v0.4.0-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'edwardsage419/Labvault-Scout' && github.ref == 'refs/heads/publication/v0.4.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: b5b306b75fd5f416f7d6d8510922b2d8aec15b4f
      CI_RUN_ID: '42814281623'
      TAG_NAME: v0.4.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate approved main commit, CI and publication date
        shell: bash
        run: |
          set -euo pipefail
          actual_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$actual_main" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.status')" = completed
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.head_sha')" = "$TARGET_SHA"
          test "$(TZ=Asia/Taipei date +%Y-%m-%d)" = "2026-11-10"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Stable tag already exists; fail closed" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Stable release already exists; fail closed" >&2
            exit 1
          fi
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fxq 'version: 0.4.0' CITATION.cff
          grep -Fxq 'date-released: 2026-11-10' CITATION.cff

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify exact-commit wheel
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == "0.4.0"'
          python -m pip install build
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1
          test -f dist/labvault_scout-0.4.0-py3-none-any.whl
          (cd dist && sha256sum ./*.whl > wheel.sha256 && sha256sum --check wheel.sha256)
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/release-smoke/bin/labvault-scout" --version | grep -F '0.4.0'
          mkdir -p smoke-input
          printf 'a,b\n1,2\n' > smoke-input/sample.csv
          "$RUNNER_TEMP/release-smoke/bin/labvault-scout" scan smoke-input -o smoke-report
          "$RUNNER_TEMP/release-smoke/bin/labvault-scout" verify smoke-report/scan.json
          "$RUNNER_TEMP/release-smoke/bin/labvault-scout" verify-bundle smoke-report
          "$RUNNER_TEMP/release-smoke/bin/labvault-scout" schema scan > schema-scan.json
          test -s schema-scan.json

      - name: Prepare accurate bilingual publication notes
        shell: bash
        run: |
          cat > release-actual-notes.md <<'NOTES'
          # LabVault Scout v0.4.0

          Stable release published 2026-11-10. Free, open-source, local, offline-first, source-read-only scientific-data preservation risk scanning.

          ## Changes
          * Stronger bounded ZIP/ZIP64 structure checks and conservative scientific-format evidence.
          * File identity and race checks across hashing and selected read-only scientific-file identification.
          * More rigorous validation of malformed scan, comparison and bundle reports.
          * Deterministic cross-platform regression coverage.

          ## Important compatibility note
          Some historical schema-1 reports with drive-prefixed relative names such as C:sample.csv can be rejected by the strict path validator. Preserve old reports and original research files. If necessary, rescan a safely named separate copy. Real-world independent end-user acceptance remains UNKNOWN.

          ## Verification
          Source commit: b5b306b75fd5f416f7d6d8510922b2d8aec15b4f
          Six-platform post-merge CI: https://github.com/edwardsage419/Labvault-Scout/actions/runs/42814281623
          The attached wheel and wheel.sha256 were built from the exact source commit and checked by offline installation and CLI smoke checks.

          ## 中文
          v0.4.0 稳定版于 2026-11-10 发布。工具完全开源、本地运行、离线优先，只读检查科研文件保存风险。
          本版加强 ZIP/ZIP64 有界结构检查、文件身份与扫描期间变化检测、异常报告和 Bundle 验证及跨平台回归测试。
          部分包含 C:sample.csv 等驱动器前缀相对路径的旧报告可能被拒绝，请保留原始数据与历史报告，需要重扫时使用安全命名的独立副本。独立真实用户验收证据仍为 UNKNOWN。
          wheel.sha256 用于核验下载文件的一致性。校验文件自身不构成发布者身份认证。
          NOTES

      - name: Create draft release and upload verified assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            dist/labvault_scout-0.4.0-py3-none-any.whl \
            dist/wheel.sha256 \
            --draft --target "$TARGET_SHA" \
            --title 'LabVault Scout v0.4.0' \
            --notes-file release-actual-notes.md
          test "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$TAG_NAME" --json assets --jq '.assets | length')" -eq 2

      - name: Independently verify draft release assets before publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify-draft
          gh release download "$TAG_NAME" --dir verify-draft --pattern '*.whl' --pattern 'wheel.sha256'
          cmp dist/labvault_scout-0.4.0-py3-none-any.whl verify-draft/labvault_scout-0.4.0-py3-none-any.whl
          cmp dist/wheel.sha256 verify-draft/wheel.sha256
          (cd verify-draft && sha256sum --check wheel.sha256)
          # GitHub's draft release must be pinned to the exact approved source commit.
          test "$(gh release view "$TAG_NAME" --json targetCommitish --jq '.targetCommitish')" = "$TARGET_SHA"

      - name: Publish stable release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG_NAME" --draft=false --latest
          test "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$TAG_NAME" --json isPrerelease --jq '.isPrerelease')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')" = "$TARGET_SHA"

      - name: Validate publicly downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify-public
          for filename in labvault_scout-0.4.0-py3-none-any.whl wheel.sha256; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
              --output "verify-public/$filename" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$filename"
          done
          cmp dist/labvault_scout-0.4.0-py3-none-any.whl verify-public/labvault_scout-0.4.0-py3-none-any.whl
          cmp dist/wheel.sha256 verify-public/wheel.sha256
          (cd verify-public && sha256sum --check wheel.sha256)
          echo "Published stable release and both public download integrity checks passed."
