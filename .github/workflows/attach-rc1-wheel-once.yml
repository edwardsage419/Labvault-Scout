name: Attach verified RC1 wheel once

on:
  push:
    branches:
      - release/rc1-publish-20261107
    paths:
      - .github/workflows/attach-rc1-wheel-once.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: labvault-rc1-wheel-asset
  cancel-in-progress: false

jobs:
  attach-wheel:
    if: github.repository == 'edwardsage419/Labvault-Scout' && github.ref == 'refs/heads/release/rc1-publish-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_SHA: 655a3b81834f13b83164951020d3c1e66db4491a
      TAG_NAME: v0.4.0rc1
      VERIFIED_MAIN_RUN: '42334584791'
    steps:
      - name: Wait for complete six-platform CI of this single workflow commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            ci=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "tests" and .event == "push")][0] | if . == null then "waiting" else (.status + " " + (.conclusion // "pending")) end')
            if [ "$ci" = 'completed success' ]; then
              echo "This commit's six-platform CI passed"
              break
            fi
            case "$ci" in
              "completed "*) echo "CI did not pass: $ci"; exit 1 ;;
            esac
            if [ "$attempt" -eq 45 ]; then echo "CI gate timed out: $ci"; exit 1; fi
            sleep 20
          done
          count=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" \
            --jq '[.workflow_runs[] | select(.name == "tests" and .event == "push")][0].id')
          test "$count" != null
          test "$(gh api "repos/${GH_REPO}/actions/runs/${count}/jobs?per_page=100" --jq '.total_count')" = 6
          test "$(gh api "repos/${GH_REPO}/actions/runs/${count}/jobs?per_page=100" --jq '[.jobs[] | select(.status == "completed" and .conclusion == "success")] | length')" = 6
      - uses: actions/checkout@v4
        with:
          ref: 655a3b81834f13b83164951020d3c1e66db4491a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen tag, release, version and original CI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(gh api "repos/${GH_REPO}/branches/main" --jq .commit.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG_NAME}" --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq .prerelease)" = true
          test "$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq .draft)" = false
          test "$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq .target_commitish)" = "$TARGET_SHA"
          test "$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '.assets | length')" = 0
          test "$(gh api "repos/${GH_REPO}/actions/runs/${VERIFIED_MAIN_RUN}" --jq .head_sha)" = "$TARGET_SHA"
          test "$(gh api "repos/${GH_REPO}/actions/runs/${VERIFIED_MAIN_RUN}" --jq .conclusion)" = success
          grep -Fxq 'version = "0.4.0rc1"' pyproject.toml
          grep -Fxq '__version__ = "0.4.0rc1"' src/labvault_scout/__init__.py
      - name: Build, inspect and offline-install the release wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel --outdir dist
          python - <<'PY'
          from pathlib import Path
          import email
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.startswith("labvault_scout-0.4.0rc1-"), wheel.name
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_paths = [name for name in names if name.endswith(".dist-info/METADATA")]
              assert len(metadata_paths) == 1
              metadata = email.message_from_bytes(archive.read(metadata_paths[0]))
              assert metadata["Name"].lower().replace("_", "-") == "labvault-scout"
              assert metadata["Version"] == "0.4.0rc1"
              assert any(name.startswith("labvault_scout/rules/") and name.endswith(".json") for name in names)
              assert len([name for name in names if name.startswith("labvault_scout/schemas/") and name.endswith(".json")]) == 4
          print(f"Validated release wheel: {wheel.name}")
          PY
          python -m venv .rc1-offline
          .rc1-offline/bin/python -m pip install --no-index --no-deps dist/*.whl
          .rc1-offline/bin/python -m pip check
          test "$(.rc1-offline/bin/labvault-scout --version)" = "labvault-scout 0.4.0rc1"
          mkdir -p rc1-smoke-input
          printf 'x,y\n1,2\n' > rc1-smoke-input/sample.csv
          .rc1-offline/bin/labvault-scout scan rc1-smoke-input -o rc1-smoke-report
          .rc1-offline/bin/labvault-scout verify rc1-smoke-report/scan.json
          .rc1-offline/bin/labvault-scout verify-bundle rc1-smoke-report
          for type in scan comparison verification bundle; do
            .rc1-offline/bin/labvault-scout schema "$type" >/dev/null
          done
          (
            cd dist
            for wheel in *.whl; do sha256sum "$wheel" > "${wheel}.sha256"; done
          )
          ls -lh dist/
      - name: Upload wheel and SHA256 only once
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '.assets | length')" = 0
          gh release upload "$TAG_NAME" dist/*.whl dist/*.sha256 --repo "$GH_REPO"
      - name: Independently download and verify published assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published-assets
          gh release download "$TAG_NAME" --pattern '*.whl' --dir published-assets --repo "$GH_REPO"
          gh release download "$TAG_NAME" --pattern '*.sha256' --dir published-assets --repo "$GH_REPO"
          cmp dist/*.whl published-assets/*.whl
          cmp dist/*.sha256 published-assets/*.sha256
          (cd published-assets && sha256sum -c *.sha256)
          test "$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '.assets | length')" = 2
          test "$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG_NAME}" --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq .prerelease)" = true
