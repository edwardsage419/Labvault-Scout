name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build
      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - run: python -m pip install pytest
      - run: pytest -q
      - run: labvault-scout --help
      - name: CLI smoke scan
        shell: bash
        run: |
          mkdir -p smoke-input
          printf "a,b\\n1,2\\n" > smoke-input/sample.csv
          labvault-scout scan smoke-input -o smoke-report
          test -f smoke-report/report.html
          test -f smoke-report/migration_plan.csv
          labvault-scout verify smoke-report/scan.json
          labvault-scout verify-bundle smoke-report
          labvault-scout schema scan > schema-scan.json
          labvault-scout schema comparison > schema-comparison.json
          labvault-scout schema verification > schema-verification.json
          labvault-scout schema bundle > schema-bundle.json
          test -s schema-scan.json
          test -s schema-comparison.json
          test -s schema-verification.json
          test -s schema-bundle.json
      - name: Verify installed package resources
        shell: python
        run: |
          import json
          from labvault_scout.risk import load_rules
          from labvault_scout.schema_registry import SCHEMA_FILES, load_schema_text

          rules = load_rules()
          for extension in (".csv", ".jnb", ".fcs", ".sav", ".zsav"):
              assert extension in rules

          assert set(SCHEMA_FILES) == {"scan", "comparison", "verification", "bundle"}
          for kind in SCHEMA_FILES:
              schema = json.loads(load_schema_text(kind))
              assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"

          print(f"Loaded {len(rules)} packaged format rules and {len(SCHEMA_FILES)} schemas")
