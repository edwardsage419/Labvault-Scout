name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip install pytest
      - run: pytest -q
      - run: labvault-scout --help
      - name: CLI smoke scan
        shell: bash
        run: |
          mkdir -p smoke-input
          printf "a,b\\n1,2\\n" > smoke-input/sample.csv
          labvault-scout scan smoke-input -o smoke-report
          test -f smoke-report/report.html
          test -f smoke-report/migration_plan.csv
      - name: Verify installed package resources
        shell: python
        run: |
          from labvault_scout.risk import load_rules
          rules = load_rules()
          assert ".jnb" in rules
          assert ".csv" in rules
          print(f"Loaded {len(rules)} packaged format rules")
