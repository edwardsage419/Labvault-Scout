[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labvault-scout"
version = "0.2.0"
description = "Local, read-only scientific data preservation risk scanner."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "LabVault Scout contributors"}]
keywords = ["scientific-data", "data-preservation", "open-science", "research-software"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Archiving"
]

[project.urls]
Homepage = "https://github.com/edwardsage419/Labvault-Scout"
Repository = "https://github.com/edwardsage419/Labvault-Scout"
Issues = "https://github.com/edwardsage419/Labvault-Scout/issues"

[project.scripts]
labvault-scout = "labvault_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labvault_scout = ["rules/*.json"]
