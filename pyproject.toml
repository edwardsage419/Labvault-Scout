[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labvault-scout"
version = "0.1.0"
description = "Local, read-only scientific data preservation risk scanner."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LabVault Scout contributors"}]
keywords = ["scientific-data", "data-preservation", "open-science", "research-software"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
labvault-scout = "labvault_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labvault_scout = ["rules/*.json"]
